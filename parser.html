<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парсинг панелі - ShopKZ</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        .parser-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .parser-section {
            background: var(--bg-white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }
        .parser-section h2 {
            margin-bottom: 1.5rem;
            color: var(--text-dark);
        }
        .url-input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .url-input-group input {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
        }
        .url-input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .parser-status {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        .parser-status.info {
            background: rgba(59, 130, 246, 0.1);
            color: #1e40af;
        }
        .parser-status.success {
            background: rgba(34, 197, 94, 0.1);
            color: #15803d;
        }
        .parser-status.error {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
        }
        .parser-log {
            background: var(--bg-light);
            padding: 1rem;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .parser-log-item {
            padding: 0.25rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        .parser-results {
            margin-top: 2rem;
        }
        .results-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-light);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }
        .stat-card-label {
            color: var(--text-light);
            margin-top: 0.5rem;
        }
        .preview-products {
            max-height: 500px;
            overflow-y: auto;
        }
        .preview-product {
            background: var(--bg-light);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .preview-product img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        .preview-product-info {
            flex: 1;
        }
        .preview-product-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .preview-product-price {
            color: var(--primary-color);
            font-weight: 700;
        }
        .btn-import-parsed {
            width: 100%;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <header>
    <div class="container">
            <div class="header-content">
                <h1 class="logo">🛍️ ShopKZ - Парсинг</h1>
                <nav>
                    <a href="admin.html">← Админ панель</a>
                </nav>
                <div class="header-actions">
                    <button class="btn-danger" onclick="logout()" data-translate="admin.logout">Шығу</button>
                </div>
            </div>
        </div>
    </header>

    <main class="admin-main" style="display: none;">
        <div class="parser-container">
            <div class="parser-section">
                <h2>Скрапинг товаров с intertop.kz</h2>
                
                <div style="display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap;">
                    <button class="btn-primary" id="scrapeWomenBtn" onclick="startScraping('women')" style="flex: 1; min-width: 200px; padding: 1.5rem; font-size: 1.2rem; font-weight: 600;">
                        👗 Әйелдер киімі
                    </button>
                    <button class="btn-primary" id="scrapeMenBtn" onclick="startScraping('men')" style="flex: 1; min-width: 200px; padding: 1.5rem; font-size: 1.2rem; font-weight: 600;">
                        👔 Ерлер киімі
                    </button>
                </div>

                <div id="scrapingStatus" class="parser-status info" style="display: none; margin-bottom: 1rem;"></div>

                <div class="parser-log" id="scrapingLog" style="min-height: 200px; max-height: 400px; overflow-y: auto;">
                    <div class="parser-log-item">Скрапинг панеліне қош келдіңіз!</div>
                    <div class="parser-log-item">Жоғарыдағы кнопкаларды басып, скрапингті бастаңыз</div>
                </div>

                <div id="downloadSection" style="display: none; margin-top: 2rem; text-align: center; padding: 2rem; background: #f0f0f0; border-radius: 8px;">
                    <h3 style="margin-top: 0;">✅ Скрапинг аяқталды!</h3>
                    <p id="scrapingStats" style="margin-bottom: 1.5rem; font-size: 1.1rem;"></p>
                    <button class="btn-primary" id="downloadBtn" onclick="downloadFile()" style="padding: 1rem 2rem; font-size: 1.1rem; font-weight: 600;">
                        📥 Файлды жүктеу
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Login Modal для парсинга -->
    <div id="parserLoginModal" class="modal show">
        <div class="modal-content login-modal">
            <h2>Парсинг панеліне кіру</h2>
            <form id="parserLoginForm">
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="parserPassword" required autofocus placeholder="Парольді енгізіңіз">
                </div>
                <div id="parserLoginError" class="error-message" style="display: none; color: var(--danger-color); margin-bottom: 1rem; font-weight: 600;"></div>
                <button type="submit" class="btn-primary">Кіру</button>
                <div style="margin-top: 1rem; font-size: 0.85rem; color: var(--text-light); text-align: center;">
                    <a href="admin.html" style="color: var(--primary-color); text-decoration: none;">← Админ панельге қайту</a>
                </div>
            </form>
        </div>
    </div>

    <script src="translations.js"></script>
    <script>
        // Пароль для парсинга (отдельный от админ панели)
        // Пароль хранится в localStorage и устанавливается через админ панель
        function getParserPassword() {
            return localStorage.getItem('parserPassword');
        }

        // Проверяем, установлен ли пароль
        const PARSER_PASSWORD = getParserPassword();
        
        if (!PARSER_PASSWORD) {
            // Если пароль не установлен, показываем сообщение
            document.getElementById('parserLoginModal').querySelector('h2').textContent = 'Пароль орнатылмаған';
            document.getElementById('parserLoginModal').querySelector('form').innerHTML = `
                <div class="form-group">
                    <label>Парсинг панелі үшін пароль орнатыңыз (мин. 6 символ)</label>
                    <input type="password" id="parserPassword" required autofocus placeholder="Жаңа пароль">
                </div>
                <div id="parserLoginError" class="error-message" style="display: none; color: var(--danger-color); margin-bottom: 1rem; font-weight: 600;"></div>
                <button type="submit" class="btn-primary">Парольді орнату</button>
                <div style="margin-top: 1rem; font-size: 0.85rem; color: var(--text-light); text-align: center;">
                    <a href="admin.html" style="color: var(--primary-color); text-decoration: none;">← Админ панельге қайту</a>
                </div>
            `;
            
            // Обновляем обработчик формы для установки пароля
            document.getElementById('parserLoginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const password = document.getElementById('parserPassword').value;
                const errorDiv = document.getElementById('parserLoginError');
                
                if (password && password.length >= 6) {
                    localStorage.setItem('parserPassword', password);
                    sessionStorage.setItem('parserLoggedIn', 'true');
                    showParserContent();
                    if (errorDiv) errorDiv.style.display = 'none';
                } else {
                    if (errorDiv) {
                        errorDiv.textContent = 'Пароль кемінде 6 символ болуы керек!';
                        errorDiv.style.display = 'block';
                    }
                    document.getElementById('parserPassword').value = '';
                    document.getElementById('parserPassword').focus();
                }
            });
        }

        // Проверка авторизации для парсинга
        function checkParserAuth() {
            // Проверяем токен доступа от админ панели
            const hasAccess = sessionStorage.getItem('parserAccess') === 'true';
            // Проверяем авторизацию парсинга
            const isParserLoggedIn = sessionStorage.getItem('parserLoggedIn') === 'true';
            
            return hasAccess || isParserLoggedIn;
        }

        // Показываем/скрываем контент
        function showParserContent() {
            const modal = document.getElementById('parserLoginModal');
            const main = document.querySelector('.admin-main');
            if (modal) modal.classList.remove('show');
            if (main) main.style.display = 'block';
        }

        function showParserLogin() {
            const modal = document.getElementById('parserLoginModal');
            const main = document.querySelector('.admin-main');
            if (modal) modal.classList.add('show');
            if (main) main.style.display = 'none';
        }

        // Обработка формы входа (только если пароль установлен)
        if (PARSER_PASSWORD) {
            document.getElementById('parserLoginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const password = document.getElementById('parserPassword').value;
                const errorDiv = document.getElementById('parserLoginError');
                
                if (password === PARSER_PASSWORD) {
                    sessionStorage.setItem('parserLoggedIn', 'true');
                    showParserContent();
                    if (errorDiv) errorDiv.style.display = 'none';
                } else {
                    if (errorDiv) {
                        errorDiv.textContent = 'Қате пароль!';
                        errorDiv.style.display = 'block';
                    }
                    document.getElementById('parserPassword').value = '';
                    document.getElementById('parserPassword').focus();
                }
            });
        }

        // Проверяем при загрузке страницы
        if (checkParserAuth()) {
            showParserContent();
        } else {
            showParserLogin();
        }

        // Проверка авторизации для функций
        function checkAuth() {
            if (!checkParserAuth()) {
                showParserLogin();
                return false;
            }
            return true;
        }

        let scrapedProducts = [];
        let isScraping = false;
        let scrapedData = null;

        // Автоматический скрапинг
        async function startScraping(gender) {
            if (!checkParserAuth()) return;
            
            if (isScraping) {
                showStatus('Скрапинг жүріп жатыр, күтіңіз...', 'info');
                return;
            }

            isScraping = true;
            scrapedProducts = [];
            document.getElementById('scrapingLog').innerHTML = '';
            document.getElementById('downloadSection').style.display = 'none';
            
            const womenBtn = document.getElementById('scrapeWomenBtn');
            const menBtn = document.getElementById('scrapeMenBtn');
            womenBtn.disabled = true;
            menBtn.disabled = true;
            
            showStatus('Скрапинг басталды...', 'info');
            addLog('🚀 Автоматты скрапинг басталды...');
            
            const urls = [];
            
            if (gender === 'women') {
                // Женские товары - все категории
                urls.push('https://intertop.kz/ru-kz/zhenskaya-obuv/');
                urls.push('https://intertop.kz/ru-kz/zhenskaya-odezhda/');
                // Бренды для женщин
                urls.push('https://intertop.kz/ru-kz/brands/nike/women/');
                urls.push('https://intertop.kz/ru-kz/brands/adidas/women/');
                urls.push('https://intertop.kz/ru-kz/brands/puma/women/');
            } else if (gender === 'men') {
                // Мужские товары - все категории
                urls.push('https://intertop.kz/ru-kz/muzhskaya-obuv/');
                urls.push('https://intertop.kz/ru-kz/muzhskaya-odezhda/');
                // Бренды для мужчин
                urls.push('https://intertop.kz/ru-kz/brands/nike/men/');
                urls.push('https://intertop.kz/ru-kz/brands/adidas/men/');
                urls.push('https://intertop.kz/ru-kz/brands/puma/men/');
            }

            addLog(`Табылды: ${urls.length} категория`);
            
            for (let i = 0; i < urls.length; i++) {
                const url = urls[i];
                const categoryName = url.includes('zhensk') ? 'Әйелдер' : 'Ерлер';
                const itemType = url.includes('obuv') ? 'Аяқ киім' : 'Киім';
                
                addLog(`\n📦 ${categoryName} - ${itemType}`);
                addLog(`URL: ${url}`);
                
                await scrapeUrl(url, gender);
                
                if (i < urls.length - 1) {
                    addLog('Келесі категорияға көшу...');
                    await delay(2000);
                }
            }

            if (scrapedProducts.length > 0) {
                // Удаляем дубликаты
                const unique = [];
                const seen = new Set();
                scrapedProducts.forEach(p => {
                    const key = p.name.toLowerCase().trim() + '_' + p.price;
                    if (!seen.has(key)) {
                        seen.add(key);
                        unique.push(p);
                    }
                });
                
                scrapedProducts = unique;
                scrapedData = JSON.stringify(scrapedProducts, null, 2);
                
                addLog(`\n✅ Скрапинг аяқталды!`);
                addLog(`Барлығы: ${scrapedProducts.length} тауар`);
                
                showStatus(`Скрапинг аяқталды! Табылды: ${scrapedProducts.length} тауар`, 'success');
                
                // Показываем кнопку скачивания
                const stats = document.getElementById('scrapingStats');
                stats.textContent = `Табылды: ${scrapedProducts.length} тауар`;
                document.getElementById('downloadSection').style.display = 'block';
            } else {
                showStatus('Тауарлар табылмады', 'error');
            }
            
            womenBtn.disabled = false;
            menBtn.disabled = false;
            isScraping = false;
        }

        async function scrapeUrl(url, gender) {
            return new Promise((resolve) => {
                addLog('Сайтты жүктеу...');
                
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = url;
                document.body.appendChild(iframe);

                iframe.onload = function() {
                    addLog('✅ Сайт жүктелді');
                    
                    setTimeout(() => {
                        try {
                            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                            
                            if (!iframeDoc) {
                                addLog('⚠️ CORS шектеулері - fetch арқылы жүктейміз');
                                fetchAndScrape(url, gender).then(() => {
                                    document.body.removeChild(iframe);
                                    resolve();
                                });
                                return;
                            }

                            scrapeProductsFromDocument(iframeDoc, url, gender);
                            document.body.removeChild(iframe);
                            resolve();
                            
                        } catch (error) {
                            addLog(`⚠️ Қате: ${error.message}`);
                            fetchAndScrape(url, gender).then(() => {
                                document.body.removeChild(iframe);
                                resolve();
                            });
                        }
                    }, 3000);
                };

                iframe.onerror = function() {
                    addLog('❌ Сайтты жүктеу қатесі');
                    fetchAndScrape(url, gender).then(() => {
                        document.body.removeChild(iframe);
                        resolve();
                    });
                };
            });
        }

        async function fetchAndScrape(url, gender) {
            try {
                addLog('Fetch арқылы деректерді алу...');
                const response = await fetch(url);
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                scrapeProductsFromDocument(doc, url, gender);
            } catch (error) {
                addLog(`⚠️ Fetch қатесі: ${error.message}`);
            }
        }

        function scrapeProductsFromDocument(doc, baseUrl, gender) {
            addLog('Тауарларды іздеу...');
            
            const selectors = [
                '[class*="product"]',
                '[class*="item"]',
                '.product-item',
                '.catalog-item',
                'article',
                '[data-product-id]',
                '.goods-item',
                '.item-card'
            ];
            
            let elements = [];
            selectors.forEach(selector => {
                const els = doc.querySelectorAll(selector);
                if (els.length > 5 && elements.length === 0) {
                    elements = Array.from(els);
                    addLog(`Табылды: ${els.length} элемент`);
                }
            });

            if (elements.length === 0) {
                addLog('⚠️ Тауарлар табылмады');
                return;
            }

            addLog(`Скрапинг: ${elements.length} элемент`);
            let scrapedCount = 0;
            
            elements.forEach((el, index) => {
                try {
                    // Название
                    const nameSelectors = ['h2', 'h3', 'h4', '[class*="title"]', '[class*="name"]', 'a[href*="/product/"]', '.product-name', '.item-title'];
                    let name = '';
                    for (const selector of nameSelectors) {
                        const nameEl = el.querySelector(selector);
                        if (nameEl) {
                            name = nameEl.textContent.trim();
                            if (name && name.length > 3) break;
                        }
                    }
                    
                    if (!name) {
                        name = el.getAttribute('data-name') || el.getAttribute('title') || '';
                    }
                    
                    if (!name || name.length < 3) return;
                    
                    // Цена
                    const priceSelectors = ['[class*="price"]', '[data-price]', '.price', '.cost', '[itemprop="price"]'];
                    let price = 0;
                    for (const selector of priceSelectors) {
                        const priceEl = el.querySelector(selector);
                        if (priceEl) {
                            const priceText = priceEl.textContent || priceEl.getAttribute('data-price') || '';
                            const priceNum = parseInt(priceText.replace(/\D/g, ''));
                            if (priceNum > 1000) {
                                price = priceNum;
                                break;
                            }
                        }
                    }
                    
                    if (price === 0 || price < 1000) return;
                    
                    // Изображение
                    const imgEl = el.querySelector('img');
                    let image = '';
                    if (imgEl) {
                        image = imgEl.src || imgEl.dataset.src || imgEl.getAttribute('data-lazy-src') || imgEl.getAttribute('data-original') || '';
                        if (image && image.startsWith('//')) {
                            image = 'https:' + image;
                        } else if (image && image.startsWith('/')) {
                            const base = baseUrl.split('/').slice(0, 3).join('/');
                            image = base + image;
                        }
                    }
                    
                    // Категория - улучшенное определение
                    let category = 'sneakers';
                    const urlLower = baseUrl.toLowerCase();
                    const nameLower = name.toLowerCase();
                    const fullText = (urlLower + ' ' + nameLower).toLowerCase();
                    
                    // Определяем категорию по URL и названию
                    if (fullText.includes('obuv') || fullText.includes('обув') || 
                        fullText.includes('кроссовк') || fullText.includes('sneaker') ||
                        fullText.includes('кебі') || fullText.includes('туфл') ||
                        fullText.includes('ботинк') || fullText.includes('shoe') ||
                        fullText.includes('sandal') || fullText.includes('сандал')) {
                        category = 'sneakers';
                    } else if (fullText.includes('rubash') || fullText.includes('рубаш') || 
                              fullText.includes('футболк') || fullText.includes('t-shirt') ||
                              fullText.includes('жейде') || fullText.includes('shirt') ||
                              fullText.includes('блузк') || fullText.includes('блуз') ||
                              fullText.includes('топ') || fullText.includes('майка') ||
                              fullText.includes('футболка') || fullText.includes('поло')) {
                        category = 'shirts';
                    } else if (fullText.includes('bryuk') || fullText.includes('брюк') || 
                              fullText.includes('шалбар') || fullText.includes('штаны') ||
                              fullText.includes('pants') || fullText.includes('trouser') ||
                              fullText.includes('джинс') || fullText.includes('jean') ||
                              fullText.includes('штан')) {
                        category = 'pants';
                    } else if (fullText.includes('kurtk') || fullText.includes('куртк') || 
                              fullText.includes('жакет') || fullText.includes('jacket') ||
                              fullText.includes('пальт') || fullText.includes('coat') ||
                              fullText.includes('ветровк') || fullText.includes('windbreaker') ||
                              fullText.includes('худи') || fullText.includes('hoodie') ||
                              fullText.includes('свитшот') || fullText.includes('sweatshirt')) {
                        category = 'jackets';
                    }
                    
                    scrapedProducts.push({
                        name: name,
                        price: price,
                        image: image,
                        category: category,
                        gender: gender
                    });
                    scrapedCount++;
                } catch (e) {
                    // Игнорируем ошибки
                }
            });

            addLog(`✅ Скрапингтелді: ${scrapedCount} тауар`);
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function downloadFile() {
            if (!scrapedData || scrapedProducts.length === 0) {
                alert('Скачивать нечего!');
                return;
            }
            
            const blob = new Blob([scrapedData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            const date = new Date().toISOString().split('T')[0];
            link.download = `intertop-products-${date}.json`;
            link.click();
            URL.revokeObjectURL(url);
            
            addLog(`📥 Файл жүктелді: intertop-products-${date}.json`);
        }

        function addLog(message, type = 'info') {
            const log = document.getElementById('scrapingLog');
            const item = document.createElement('div');
            item.className = 'parser-log-item';
            item.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(item);
            log.scrollTop = log.scrollHeight;
        }

        function showStatus(message, type = 'info') {
            const status = document.getElementById('scrapingStatus');
            status.textContent = message;
            status.className = `parser-status ${type}`;
            status.style.display = 'block';
        }

        function logout() {
            sessionStorage.removeItem('parserLoggedIn');
            window.location.href = 'admin.html';
        }

    </script>
</body>
</html>
